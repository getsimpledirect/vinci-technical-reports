# Release parameters for Technical Report No. 2.
# Sourced by scripts/assemble_release.sh and scripts/zenodo_stage.sh.
# One of these per report; the scripts carry no report-specific values.

REPORT_TITLE="Character Transfer Across Three Model Families: Reduced unsupported assertions, impaired grounded answering, and a failed utility-preservation bar"
REPORT_NUMBER="Vinci Technical Report No. 2"
REPORT_VERSION="1.0"
PACKAGE_REVISION="1.0"
PUB_DATE="2026-09-01"

PDF_NAME="Vinci_Technical_Report_No_2.pdf"
ZIP_BASE="Vinci-TR2-Character-Transfer-v1.0-public"

ZENODO_DEP_ID="22236690"
DOI="10.5281/zenodo.22236690"
REPORT_URL="https://www.getsimpledirect.com/research/papers/character-transfer-across-three-model-families"

# Content gates gate on the BUILT PDF's text. REQUIRE must all be present;
# FORBID must all be absent. These are what stop a draft shipping as final, so
# they are per-report data, not script logic.
# Note the separator in the title line is a BULLET, not a hyphen -- gating on a
# hyphen rejected the correct v1.0 PDF. The regex tolerates either.
PDF_REQUIRE_REGEX=( "Version 1\.0 (-|.) 1 September 2026" "Outstanding Evidence Work" )
PDF_FORBID=( "Version 0.9" "publication draft" "Publication Corrections Required Before Version 1.0" )
MIN_PAGES=8

ZENODO_KEYWORDS='["character post-training","Direct Preference Optimization","unsupported assertions","answer preservation","cross-family transfer","LLM-as-a-judge","evaluation reliability","negative result"]'
ZENODO_SCOPE="Development-tier validation evidence only. Refusal adjustment is Judge-B-only. Capability preservation was not evaluated. No external audit was performed. The primary holdout remains sealed. No model checkpoint is recommended for release."
ZENODO_CREATORS_JSON='[{"name":"Pu, George","affiliation":"SimpleDirect / Vinci Research"},{"name":"Naik, Ayush","affiliation":"SimpleDirect / Vinci Research"}]'
ZENODO_DESCRIPTION_LEAD="We tested one frozen character post-training recipe across three model families. It reduced unsupported assertions, but no family preserved grounded-answer accuracy well enough to meet the pre-registered bar."
ZENODO_AVAILABILITY_NOTE="This is an aggregate-only release. It does not contain item-level scored outputs, judge ledgers, benchmark prompt text, model weights, or the primary-test holdout, and does not support independent recomputation of the readout. See Appendix D of the report."

# Licence id as Zenodo expects it, and a distinctive substring of the scope
# line that the end-state assertion greps for in the published description.
LICENSE_ID="cc-by-4.0"
SCOPE_PROBE="No model checkpoint is recommended for release"
