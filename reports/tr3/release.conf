# Sourced by scripts/assemble_release.sh and scripts/zenodo_stage.sh.
# One of these per report; the scripts carry no report-specific values.

REPORT_TITLE="Runtime Pass Is Not Correctness: A Negative Reasoning-Efficiency Post-Training Result and Verifier Audit on Qwen3.8-27B"
REPORT_NUMBER="Vinci Technical Report No. 3"
VERSION="1.0.1"
PUB_DATE="2026-09-01"

PDF_NAME="Vinci_Technical_Report_No_3_v1.0.pdf"
ZIP_BASE="Vinci-TR3-Runtime-Pass-Is-Not-Correctness-v1.0-public"

# Reserved 2026-09-02 as a draft deposition (unsubmitted, no files).
# Unlike TR2, TR3 does not embed the DOI in the PDF: release/LIMITATIONS.md
# item 12 and RELEASE_NOTES.md record that as a deliberate choice, so the
# assemble_release.sh DOI-in-PDF check is expected to WARN for this report.
ZENODO_DEP_ID="22241477"
DOI="10.5281/zenodo.22241477"
REPORT_URL="https://www.getsimpledirect.com/research/papers/runtime-pass-is-not-correctness"

# Content gates gate on the BUILT PDF's text. REQUIRE must all be present;
# FORBID must all be absent.
#
# NOTE: unlike TR2, the TR3 title page carries no "Version 1.0" line -- it prints
# title, subtitle, author, then the bare date. The version appears only in the
# body's Publication record. Gating on a TR2-shaped title line would reject every
# correct TR3 PDF, so these gates are written against TR3's actual text.
PDF_REQUIRE_REGEX=(
  # The redesigned cover wraps the title across two lines, so this must tolerate
  # the break. Matching the one-line form rejected a correct PDF.
  "Runtime Pass Is Not[[:space:]]+Correctness"
  # Identifier-level checks. NOTE these do NOT catch the Inter private-use
  # defect: it corrupted only the sans cover/TOC/captions ("Qwen3.827B",
  # "PBREVE01") while the Charter body text stayed clean, so both patterns
  # still matched elsewhere and the gate passed. Only pdf_text_sanity.py
  # catches that. These stand as ordinary content gates.
  "Qwen3\\.8-27B"
  "P-BREVE-01"
  "1 September 2026"
  "Publication record\. Version 1\.0;"
  "recorded in the release notes for tag"
)

# FORBID encodes the four defects found in the v1.0/v1.0.1 packages. A PDF built
# from pre-correction sources trips these, which is the point: the delivered
# v1.0.1 PDF fails this list, and a PDF rebuilt from corrected sources passes.
PDF_FORBID=(
  "TO BE FROZEN"
  "TO BE RULED"
  "TO BE GENERATED"
  "intentionally uses placeholders"
)
MIN_PAGES=30

# Accepted build: 43 pages, 0 private-use code points, all gates pass.
# The redesign sets \setsansfont{Inter}[RawFeature={-calt,-case}]. NOT
# Ligatures=NoContextual -- that disables clig, and the PUA substitution came
# through calt.

# Dead-link gate. This CANNOT go in PDF_FORBID: pdftotext sees only a link's
# visible label, and TR3's label is the bare repo name -- which the corrected
# report still legitimately prints as provenance. A text-level rule would either
# never fire, or reject the correct PDF. These match against the PDF's /URI
# annotations instead, via scripts/pdf_uris.py.
PDF_FORBID_URI=( "vinci-gpu-research" )

ZENODO_KEYWORDS='["reasoning efficiency","Direct Preference Optimization","executable verifiers","reward hacking","mutation testing","evaluator qualification","negative result","Qwen3"]'
ZENODO_SCOPE="Development-tier result on one model lineage. The replacement verifier bank is not qualified. The superseded adequacy claim is withdrawn. Reported rates characterise the audited evaluation set and do not estimate ordinary product traffic. No model checkpoint is recommended, released, or promoted on the basis of this report."

LICENSE_ID="cc-by-4.0"
